[package]
name = "helix-tauri-shell"
version = "0.0.0"
description = "Helix P1.5.2: Tauri 2 shell around the P1.4.1 Mol* page (experiment)"
edition = "2021"
publish = false

[lib]
name = "helix_tauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-http = "=2.8.3"
serde_json = "=1.0.154"
base64 = "=0.22.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
